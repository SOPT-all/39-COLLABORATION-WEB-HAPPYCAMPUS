name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

# 배포 도중 취소되지 않도록 순서대로 실행
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Production 배포
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run --if-present lint

      - name: Install Vercel CLI
        run: npm install --global vercel@65.12.1

      - name: Pull Vercel settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # vercel build가 pnpm build를 실행하므로, 빌드에 실패하면 배포 단계로 넘어가지 않음
      - name: Build for Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
