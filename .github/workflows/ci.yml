name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]

# 같은 PR에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 스크립트가 아직 없으면 건너뛰고, 추가되면 자동으로 검사에 포함
      - name: Lint
        run: pnpm run --if-present lint

      - name: Format check
        run: pnpm run --if-present format:check

      - name: Build
        run: pnpm build

  preview:
    name: Preview Deploy
    needs: build
    # fork에서 올라온 PR은 Secrets를 읽을 수 없고, Draft PR은 배포하지 않음
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 댓글 작성 권한은 이 잡에만 부여
    permissions:
      contents: read
      pull-requests: write

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install --global vercel@65.12.1

      - name: Pull Vercel settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build for Vercel
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = '<!-- vercel-preview -->';
            const body = [
              marker,
              '🚀 **프리뷰 배포가 완료되었어요!**',
              '',
              `- URL: ${process.env.PREVIEW_URL}`,
              `- Commit: ${context.payload.pull_request.head.sha.slice(0, 7)}`,
            ].join('\n');

            // PR마다 댓글을 하나만 유지하고, 새 커밋이 올라오면 내용만 갱신
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
